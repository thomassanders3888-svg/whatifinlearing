<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Attune</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f4efe8;--deep:#ebe3d8;--surface:#fffcf8;--fg:#1f1814;--muted:#6f6258;
  --terra:#8f3a2a;--terra-fg:#fffcf8;--sage:#4a6356;--sage-fg:#f4efe8;--line:#e4d8cc;--ink:#3f342c;
  --sans:"Figtree",system-ui,sans-serif;--display:"Fraunces",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--sans);min-height:100%}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;font-weight:600;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0}
.wrap{max-width:28rem;margin:0 auto;padding:1.1rem 1.2rem 7rem}
.kicker{font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:1.25rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;min-height:2.75rem;padding:0 1rem;border-radius:999px;font-size:.875rem;font-weight:600}
.week{display:flex;gap:.2rem;padding:.4rem}
.wday{flex:1;display:flex;flex-direction:column;align-items:center;padding:.4rem 0;border-radius:.85rem;min-height:3.4rem}
.wday .l{font-size:.65rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wday.on{background:var(--terra);color:var(--terra-fg)}
.wday.on .l{color:color-mix(in srgb,var(--terra-fg) 70%,transparent)}
.hero{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;background:var(--terra);color:var(--terra-fg);border-radius:1.25rem;padding:1.2rem 1.25rem;margin-top:1.1rem}
.hero .sub{opacity:.75;font-size:.875rem;margin-top:.25rem}
.list{overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;min-height:3.25rem;padding:.75rem 1rem;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.time{font-variant-numeric:tabular-nums;font-size:.75rem;color:var(--muted)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 .9rem max(.75rem,env(safe-area-inset-bottom));pointer-events:none}
.nav ul{pointer-events:auto;display:flex;width:100%;max-width:28rem;gap:.2rem;padding:.2rem;margin:0;list-style:none;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 32px -12px rgba(31,24,20,.28)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-height:3rem;border-radius:999px;font-size:.7rem;font-weight:500;color:var(--muted)}
.nav a.on{background:var(--deep);color:var(--fg)}
.timeline{display:flex;gap:.75rem}
.dot{width:2rem;display:flex;flex-direction:column;align-items:center}
.dot b{width:2rem;height:2rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.7rem}
.dot b.ok{background:var(--sage);border-color:var(--sage);color:var(--sage-fg)}
.dot b.now{background:var(--terra);border-color:var(--terra);color:var(--terra-fg)}
.spine{width:1px;flex:1;background:var(--line);margin:.25rem 0 0}
.switch{position:relative;width:3.4rem;height:2rem;border-radius:999px;background:var(--deep);flex-shrink:0}
.switch.on{background:var(--sage)}
.switch i{position:absolute;top:.2rem;left:.25rem;width:1.55rem;height:1.55rem;border-radius:999px;background:var(--surface);transition:transform .2s}
.switch.on i{transform:translateX(1.4rem)}
input[type=time]{height:2.5rem;border:0;border-radius:.75rem;background:var(--deep);padding:0 .7rem;font:inherit;font-variant-numeric:tabular-nums}
.step{display:flex;gap:.75rem;padding:.8rem 1rem;margin:.45rem 0}
.n{width:1.75rem;height:1.75rem;border-radius:999px;background:var(--deep);display:grid;place-items:center;font-size:.75rem;font-weight:600;flex-shrink:0}
.cta{position:fixed;left:0;right:0;bottom:5.5rem;display:flex;justify-content:center;padding:0 1.2rem;pointer-events:none}
.cta button{pointer-events:auto;width:100%;max-width:28rem}
textarea{width:100%;border:1px solid var(--line);border-radius:1.25rem;padding:.85rem 1rem;font:inherit;background:var(--surface);min-height:6.5rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal button{min-height:2.6rem;border-radius:999px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap" style="padding-top:.4rem"><a href="/" class="muted" style="font-size:.8rem;font-weight:500">WhatIfInlearing</a></div>
<div class="wrap" id="app"></div>
<nav class="nav"><ul>
  <a href="#/" id="n-t">Today</a>
  <a href="#/plan" id="n-p">Plan</a>
  <a href="#/learn" id="n-l">Learn</a>
  <a href="#/alerts" id="n-a">Alerts</a>
</ul></nav>
<script>
const FOCUS=["Shared meaning","Love maps","Fondness","Turn toward","Influence","Solvable problems","Gridlock + date"];
const FOCUS_ID=["weekly-meaning","weekly-love-maps","weekly-fondness","weekly-turn-toward","weekly-influence","weekly-solvable","weekly-gridlock"];
const ACT={
  "daily-cherish":{title:"Morning cherish",min:3,level:"Fondness",sum:"Name one specific thing you admire before the day takes over.",why:"A living culture of appreciation is the antidote to contempt and keeps the 5:1 climate.",steps:["Before phones, name one concrete appreciation.","Tell them: I noticed… and it made me feel…","If they are not there, send a short note."],prompts:["One thing they did recently that I still respect is…","A quality I would miss overnight is…"],script:"I noticed you ______ yesterday. I don’t say it enough."},
  "daily-bids":{title:"Sliding-door watch",min:5,level:"Turn toward",sum:"Trust is built when you turn toward a sigh, a look, a comment.",why:"Masters turn toward about 86% of bids. Missing them is how a betrayal metric grows.",steps:["Notice three bids today.","Pause. Put the phone down. Face them.","Respond to the feeling, not just the content."],prompts:["A bid I almost missed was…","One way I can turn toward tonight is…"]},
  "daily-stress":{title:"Stress-reducing conversation",min:20,level:"ATTUNE",sum:"Twenty minutes about the outside world. Listen. Do not fix unless asked.",why:"ATTUNE is Awareness, Turning toward, Tolerance, Understanding, Non-defensive, Empathy.",steps:["Phones away. Ten minutes each.","Ask, reflect, take their side against the world.","No advice until invited."],prompts:["What was the most stressful part of your day?","How can I be on your team — not as a fixer?"],script:"I’m just going to listen. Tell me about the day outside of us."},
  "daily-kiss":{title:"Ritual of connection",min:2,level:"Shared meaning",sum:"A six-second kiss or a reliable hello. Predictable warmth is the wall of trust.",why:"Daily rituals answer: will you be there for me?",steps:["Pick one ritual and keep it consistent.","Six seconds — long enough you cannot fake it.","If you fought, the ritual still happens."],prompts:["Our current hello/goodbye is…"]},
  "weekly-love-maps":{title:"Love-map hour",min:25,level:"Principle 1",sum:"Update the inner map of their world this week.",why:"Without a current map, bids get missed.",steps:["Each answers three questions.","Write one new fact.","End with one supportive act this week."],prompts:["What is weighing on you that I might not see?"]},
  "weekly-fondness":{title:"Fondness scan",min:15,level:"Principle 2",sum:"Scan for what you respect. Say it out loud.",why:"Contempt cannot grow in a climate of respect.",steps:["List three specific appreciations.","Share one.","Catch yourself if a trash thought appears."],prompts:["A quality I admire today is…"]},
  "weekly-turn-toward":{title:"Bid practice",min:20,level:"Principle 3",sum:"Practice turning toward on purpose.",why:"Tiny doors decide the marriage.",steps:["Name a recent miss.","Repair it.","Set a bid you will answer tonight."],prompts:["A bid I turned away from was…"]},
  "weekly-influence":{title:"Accept influence",min:20,level:"Principle 4",sum:"Let them change your mind on something small.",why:"Shared power is a trust behavior.",steps:["Pick a small decision.","Ask what they prefer.","Do it their way once, without scorekeeping."],prompts:["Where do I refuse to be influenced?"]},
  "weekly-solvable":{title:"Solve one solvable",min:25,level:"Principle 5",sum:"Soft start-up, repair, compromise.",why:"Harsh start-up predicts failure more than the topic.",steps:["I feel X about Y and I need Z.","Take a break if flooded.","Leave with one experiment."],prompts:["A problem that is actually solvable this week is…"]},
  "weekly-gridlock":{title:"Dreams in conflict",min:30,level:"Principle 6",sum:"Find the dream under the position.",why:"About 69% of problems are perpetual.",steps:["Each states the dream, not the demand.","Ask: what does this stand for?","Honor both dreams in a temporary compromise."],prompts:["The dream under my side is…"]},
  "weekly-date":{title:"Protected date",min:120,level:"Principle 6",sum:"Time together that is not logistics.",why:"Friendship is the soil the house grows in.",steps:["Protect the time.","No problem-solving.","End with one appreciation."],prompts:["What would feel like a date for us, not a task?"]},
  "weekly-meaning":{title:"State of the Union",min:60,level:"Principle 7",sum:"Appreciations, one issue, week scan, shared meaning.",why:"The weekly meeting keeps the culture current.",steps:["Five minutes of appreciation.","One issue with a soft start.","What shall we try this week?"],prompts:["What felt like us this week?"]}
};
const LESSONS=[
  {s:"attune",g:"trust",t:"ATTUNE — how trust is built",k:"Science of Trust",m:7,b:["Trust is acting to raise your partner’s payoff, not yours alone. ATTUNE: Awareness, Turning toward, Tolerance, Understanding, Non-defensive, Empathy.","When you’re upset, the world stops and I listen."],p:"daily-stress"},
  {s:"sliding",g:"trust",t:"Sliding-door moments",k:"Science of Trust",m:5,b:["Bids are brief. Masters turn toward about 86% of the time; couples who later divorced about 33%.","Trust is not declared. It is showing up for a sigh."],p:"daily-bids"},
  {s:"ratio",g:"trust",t:"The 5:1 climate",k:"Science of Trust",m:4,b:["Stable couples keep about five positives for every negative during conflict.","You cannot fake the ratio if friendship is empty."]},
  {s:"betrayal",g:"trust",t:"Trust vs. the betrayal metric",k:"Science of Trust",m:6,b:["Betrayal is any pattern of not having their back — not only an affair.","The opposite cascade is daily: turn toward, cherish, repair."]},
  {s:"love-maps",g:"principles",t:"Principle 1 — Love maps",k:"Seven principles",m:5,b:["Know their inner world. Update it on purpose."],p:"weekly-love-maps"},
  {s:"fondness",g:"principles",t:"Principle 2 — Fondness",k:"Seven principles",m:5,b:["Scan for what you admire. Contempt cannot grow there."],p:"weekly-fondness"},
  {s:"turn",g:"principles",t:"Principle 3 — Turn toward",k:"Seven principles",m:5,b:["Most bids are small. Answer them."],p:"weekly-turn-toward"},
  {s:"influence",g:"principles",t:"Principle 4 — Accept influence",k:"Seven principles",m:5,b:["Let them change your mind. Shared power is trust."],p:"weekly-influence"},
  {s:"solvable",g:"principles",t:"Principle 5 — Solvable problems",k:"Seven principles",m:6,b:["Soft start-up. Repair. Compromise."],p:"weekly-solvable"},
  {s:"gridlock",g:"principles",t:"Principle 6 — Gridlock",k:"Seven principles",m:6,b:["Most problems are perpetual. Honor the dream underneath."],p:"weekly-gridlock"},
  {s:"meaning",g:"principles",t:"Principle 7 — Shared meaning",k:"Seven principles",m:5,b:["Rituals, roles, goals, symbols. Design them together."],p:"weekly-meaning"},
  {s:"horsemen",g:"horsemen",t:"Four Horsemen",k:"Conflict",m:6,b:["Criticism, contempt, defensiveness, stonewalling. Antidotes: gentle start-up, appreciation, responsibility, self-soothe."],p:"weekly-solvable"}
];
const TIMES={morning:"07:30",midday:"12:30",evening:"19:00",night:"21:30"};
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function logs(){try{return JSON.parse(localStorage.getItem("attune.logs")||"{}")}catch(e){return{}}}
function saveLogs(x){localStorage.setItem("attune.logs",JSON.stringify(x))}
function rem(){try{return Object.assign({on:true},JSON.parse(localStorage.getItem("attune.rem")||"{}"),{...TIMES,...JSON.parse(localStorage.getItem("attune.times")||"{}")})}catch(e){return{on:true,...TIMES}}}
function fmt(t){const [h,m]=t.split(":").map(Number);const s=h>=12?"PM":"AM";const h12=h%12||12;return h12+":"+pad(m)+" "+s}
function dayEvents(d){
  const r=rem();
  const w=d.getDay();
  const list=[
    {id:"daily-cherish",time:r.morning||TIMES.morning},
    {id:"daily-bids",time:r.midday||TIMES.midday},
    {id:FOCUS_ID[w],time:w===0||w===6?"10:00":"08:15"},
    {id:"daily-stress",time:r.evening||TIMES.evening},
    {id:"daily-kiss",time:r.night||TIMES.night}
  ];
  if(w===6) list.push({id:"weekly-date",time:"19:00"});
  return list;
}
function hash(){return (location.hash.replace(/^#/,"")||"/")}
function nav(){
  const h=hash();
  [["n-t","/"],["n-p","/plan"],["n-l","/learn"],["n-a","/alerts"]].forEach(([id,p])=>{
    document.getElementById(id).classList.toggle("on", p==="/" ? h==="/" : h.startsWith(p));
  });
}
function weekHtml(sel){
  const start=new Date(sel); start.setDate(sel.getDate()-sel.getDay());
  const L=logs();
  let h='<div class="card week">';
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const on=ymd(d)===ymd(sel);
    const c=(L[ymd(d)]||{});
    const n=Object.values(c).filter(Boolean).length;
    h+=`<button class="wday ${on?"on":""}" data-iso="${ymd(d)}"><span class="l">${"SMTWTFS"[i]}</span><span style="font-weight:600;margin-top:.15rem">${d.getDate()}</span><span style="width:.28rem;height:.28rem;border-radius:99px;margin-top:.25rem;background:${n?"currentColor":"transparent"}"></span></button>`;
  }
  return h+"</div>";
}
function toggle(id,iso){
  const L=logs(); L[iso]=L[iso]||{}; L[iso][id]=!L[iso][id]; saveLogs(L); render();
}
function viewToday(){
  const d=new Date(); const iso=ymd(d); const ev=dayEvents(d); const L=logs()[iso]||{};
  const next=ev.find(e=>!L[e.id]); const done=ev.filter(e=>L[e.id]).length;
  const pct=Math.round(done/ev.length*100);
  const now=Date.now();
  return `<p class="kicker">${d.toLocaleDateString(undefined,{weekday:"long"})}</p>
    <h1 style="font-size:2.1rem;line-height:.95;margin:.35rem 0 1rem">Today</h1>
    ${weekHtml(d)}
    <section class="hero">
      <div>
        <p class="kicker" style="color:color-mix(in srgb,var(--terra-fg) 70%,transparent)">${next?"Up next":"Day complete"}</p>
        <h2 style="font-size:1.45rem;margin-top:.2rem">${next?ACT[next.id].title:"You showed up"}</h2>
        <p class="sub">${next?fmt(next.time)+" · "+ACT[next.id].min+" min":done+" of "+ev.length}</p>
        ${next?`<a class="pill" style="margin-top:.9rem;background:var(--surface);color:var(--fg)" href="#/do/${next.id}">Begin</a>`:""}
      </div>
      <div style="font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums">${pct}%</div>
    </section>
    <h2 style="margin:1.6rem 0 .8rem;font-size:1.25rem">Schedule</h2>
    ${ev.map((e,i)=>{
      const a=ACT[e.id]; const doneB=!!L[e.id];
      const t=new Date(); const [hh,mm]=e.time.split(":").map(Number); t.setHours(hh,mm,0,0);
      const isNow=Math.abs(t-now)<40*60*1000 && !doneB;
      return `<div class="timeline">
        <div class="dot"><b class="${doneB?"ok":isNow?"now":""}" onclick="toggle('${e.id}','${iso}')">${doneB?"✓":""}</b>${i<ev.length-1?'<div class="spine"></div>':""}</div>
        <a href="#/do/${e.id}" class="card" style="flex:1;padding:1rem;margin-bottom:.75rem;${doneB?"opacity:.6":""}">
          <div style="display:flex;justify-content:space-between;gap:.5rem"><h3 style="font-size:1.1rem">${a.title}</h3><span class="time">${fmt(e.time)}</span></div>
          <p class="muted" style="font-size:.75rem;margin:.25rem 0">${a.min} min · ${a.level}</p>
          <p style="font-size:.9rem;color:var(--ink)">${a.sum}</p>
          ${isNow?'<p style="color:var(--terra);font-size:.75rem;font-weight:600;margin:.4rem 0 0">Now</p>':""}
        </a></div>`;
    }).join("")}
    <a href="#/do/${FOCUS_ID[d.getDay()]}" class="card" style="display:flex;justify-content:space-between;align-items:center;padding:1rem 1.1rem">
      <div><p class="kicker">This week’s principle</p><h3 style="margin-top:.3rem">${FOCUS[d.getDay()]}</h3></div>
      <span class="muted">→</span>
    </a>`;
}
function viewPlan(){
  const sel=window._sel||new Date();
  const ev=dayEvents(sel); const iso=ymd(sel);
  const now=new Date();
  const first=new Date(now.getFullYear(),now.getMonth(),1);
  const start=new Date(first); start.setDate(1-first.getDay());
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const on=ymd(d)===ymd(sel);
    cells+=`<button class="${on?"on":""}" style="${on?"background:var(--terra);color:var(--terra-fg)":d.getMonth()!==now.getMonth()?"opacity:.3":""}" data-iso="${ymd(d)}">${d.getDate()}</button>`;
  }
  return `<p class="kicker">Your week</p><h1 style="font-size:2.1rem;line-height:.95;margin:.35rem 0 1rem">Plan</h1>
    ${weekHtml(sel)}
    <div class="card" style="padding:.6rem;margin-top:.8rem">
      <p style="text-align:center;font-family:var(--display);margin:.3rem 0 .4rem">${now.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</p>
      <div class="cal muted" style="font-size:.72rem;font-weight:500">${"SMTWTFS".split("").map(x=>`<div>${x}</div>`).join("")}</div>
      <div class="cal" id="month">${cells}</div>
    </div>
    <h2 style="margin:1.4rem 0 .3rem;font-size:1.25rem">${sel.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</h2>
    <p class="muted">${FOCUS[sel.getDay()]}</p>
    <div style="margin-top:1rem">${ev.map(e=>{
      const a=ACT[e.id];
      return `<a href="#/do/${e.id}" class="card" style="display:block;padding:1rem;margin-bottom:.55rem"><div style="display:flex;justify-content:space-between"><h3>${a.title}</h3><span class="time">${fmt(e.time)}</span></div><p class="muted" style="font-size:.8rem;margin-top:.2rem">${a.min} min · ${a.level}</p></a>`;
    }).join("")}</div>`;
}
function viewLearn(){
  const groups=[["Seven Principles","principles"],["Science of Trust","trust"],["When it gets hard","horsemen"]];
  return `<p class="kicker">Briefings</p><h1 style="font-size:2.1rem;line-height:.95;margin:.35rem 0 1rem">Learn</h1>`+
    groups.map(([title,g])=>`<h2 style="margin:1.2rem 0 .45rem;font-size:1.2rem">${title}</h2>
      <div class="card list">${LESSONS.filter(l=>l.g===g).map(l=>`<a class="row" href="#/lesson/${l.s}"><div><div style="font-weight:500">${l.t}</div><div class="muted" style="font-size:.75rem">${l.k} · ${l.m} min</div></div><span class="muted">›</span></a>`).join("")}</div>`).join("");
}
function viewLesson(s){
  const l=LESSONS.find(x=>x.s===s); if(!l) return `<p>Missing.</p>`;
  return `<a href="#/learn" class="muted">← Learn</a>
    <p class="kicker" style="margin-top:1.2rem">${l.k} · ${l.m} min</p>
    <h1 style="font-size:2.05rem;line-height:.95;margin:.4rem 0 1rem">${l.t}</h1>
    ${l.b.map(p=>`<p style="color:var(--ink);margin:0 0 1rem">${p}</p>`).join("")}
    ${l.p?`<a class="pill" style="background:var(--terra);color:var(--terra-fg)" href="#/do/${l.p}">Practice this today</a>`:""}`;
}
function viewDo(id){
  const a=ACT[id]; if(!a) return `<p>Missing.</p>`;
  const iso=ymd(new Date()); const done=!!(logs()[iso]||{})[id];
  return `<a href="#/" class="muted">← Today</a>
    <p class="kicker" style="margin-top:1.2rem">${a.min} min · ${a.level}</p>
    <h1 style="font-size:2.05rem;line-height:.95;margin:.4rem 0">${a.title}</h1>
    <p style="color:var(--ink);margin:.7rem 0 1rem">${a.sum}</p>
    <div class="card" style="padding:1rem"><p class="kicker">Why this works</p><p style="margin:.4rem 0 0;color:var(--ink);font-size:.9rem">${a.why}</p></div>
    <h2 style="margin:1.2rem 0 .4rem;font-size:1.25rem">How</h2>
    ${a.steps.map((s,i)=>`<div class="card step"><span class="n">${i+1}</span><p style="margin:0;font-size:.9rem;color:var(--ink)">${s}</p></div>`).join("")}
    ${a.script?`<blockquote style="background:var(--deep);border-radius:1.25rem;padding:1rem 1.2rem;font-family:var(--display);font-size:1.2rem;margin:1rem 0">${a.script}</blockquote>`:""}
    <h2 style="margin:1.2rem 0 .4rem;font-size:1.25rem">Prompts</h2>
    ${a.prompts.map(p=>`<div class="card" style="padding:.85rem 1rem;margin:.4rem 0;font-size:.9rem">${p}</div>`).join("")}
    <p style="font-weight:500;margin:1.2rem 0 .4rem">Notes</p>
    <textarea id="note" placeholder="What did you notice?">${(JSON.parse(localStorage.getItem("attune.notes")||"{}")[iso+id]||"")}</textarea>
    <div class="cta"><button class="pill" style="justify-content:center;background:${done?"var(--sage)":"var(--terra)"};color:${done?"var(--sage-fg)":"var(--terra-fg)"}" onclick="toggle('${id}','${iso}')">${done?"Done — tap to undo":"Mark as done"}</button></div>`;
}
function viewAlerts(){
  const r=rem();
  return `<p class="kicker">On this phone</p><h1 style="font-size:2.1rem;line-height:.95;margin:.35rem 0 1rem">Alerts</h1>
    <div class="card row"><div><div style="font-weight:500">${r.on?"Reminders on":"Reminders off"}</div><div class="muted" style="font-size:.85rem">Native alarms fire even if the app is closed.</div></div>
    <button class="switch ${r.on?"on":""}" id="tog"><i></i></button></div>
    <h2 style="margin:1.4rem 0 .45rem;font-size:1.2rem">Daily</h2>
    <div class="card list">
      ${[["morning","Morning cherish"],["midday","Midday bids"],["evening","Evening attune"],["night","Night ritual"]].map(([k,l])=>`<label class="row"><span>${l}</span><input type="time" data-k="${k}" value="${r[k]||TIMES[k]}"/></label>`).join("")}
    </div>`;
}
function render(){
  nav();
  const root=document.getElementById("app");
  const h=hash();
  if(h.startsWith("/plan")) root.innerHTML=viewPlan();
  else if(h.startsWith("/learn")) root.innerHTML=viewLearn();
  else if(h.startsWith("/lesson/")) root.innerHTML=viewLesson(h.split("/")[2]);
  else if(h.startsWith("/do/")) root.innerHTML=viewDo(h.split("/")[2]);
  else if(h.startsWith("/alerts")) root.innerHTML=viewAlerts();
  else root.innerHTML=viewToday();
  bind();
}
function bind(){
  document.querySelectorAll(".week [data-iso]").forEach(b=>b.onclick=()=>{
    const [y,m,d]=b.dataset.iso.split("-").map(Number);
    window._sel=new Date(y,m-1,d); location.hash="#/plan"; render();
  });
  document.querySelectorAll("#month [data-iso]").forEach(b=>b.onclick=()=>{
    const [y,m,d]=b.dataset.iso.split("-").map(Number);
    window._sel=new Date(y,m-1,d); render();
  });
  const note=document.getElementById("note");
  if(note){ note.onblur=()=>{ const h=hash(); const id=h.split("/")[2]; const iso=ymd(new Date()); const n=JSON.parse(localStorage.getItem("attune.notes")||"{}"); n[iso+id]=note.value; localStorage.setItem("attune.notes",JSON.stringify(n)); }; }
  const tog=document.getElementById("tog");
  if(tog) tog.onclick=()=>{
    const r=rem(); r.on=!r.on; localStorage.setItem("attune.rem",JSON.stringify(r)); syncNative(r); render();
  };
  document.querySelectorAll("input[type=time][data-k]").forEach(inp=>{
    inp.onchange=()=>{ const t=JSON.parse(localStorage.getItem("attune.times")||"{}"); t[inp.dataset.k]=inp.value; localStorage.setItem("attune.times",JSON.stringify(t)); syncNative(rem()); };
  });
}
function split(t){const [h,m]=String(t).split(":").map(Number);return [h||0,m||0]}
function syncNative(r){
  const A=window.AttuneAndroid; if(!A) return;
  if(!r.on){ [1,2,3,4].forEach(id=>A.cancel(id)); return; }
  const [h1,m1]=split(r.morning); A.schedule(1,h1,m1,"Morning cherish","Name one specific appreciation.");
  const [h2,m2]=split(r.midday); A.schedule(2,h2,m2,"Sliding-door watch","Turn toward the next bid.");
  const [h3,m3]=split(r.evening); A.schedule(3,h3,m3,"ATTUNE conversation","Twenty minutes. Listen first.");
  const [h4,m4]=split(r.night); A.schedule(4,h4,m4,"Ritual of connection","Six-second kiss or hello.");
}
window.addEventListener("hashchange",render);
render();
if(window.AttuneAndroid){ const r=rem(); if(r.on) syncNative(r); }
</script>

<script src="/nav.js" defer></script>
</body>
</html>
